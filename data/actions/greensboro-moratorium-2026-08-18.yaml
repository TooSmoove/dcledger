# Minutes of the City Council special meeting of Aug 17, 2026, recessed and reconvened Aug 18 at 5:32 p.m. (archived
# 6664fb8d…, pages 10-11). On Aug 18 the council amended its Aug 3 motion "by striking the reference to a moratorium
# not exceeding 120 days ... and substituting a moratorium period of 180 days" (voice vote, 8-0), then adopted "the
# moratorium ordinance establishing a temporary development moratorium applicable to data center facilities with
# electrical power demand exceeding 10 megawatts for a period of 180 days. The motion carried by voice vote. 8-0
# Mayor Pro-Tem Roth was recused." The Greensboro Thread's report (ac94053e…) matches. The regular Aug 18 minutes
# (0759dfed…) record no vote on it.
