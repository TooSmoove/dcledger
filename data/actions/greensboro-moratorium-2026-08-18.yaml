# Minutes of the City Council special meeting of Aug 17, 2026, recessed and reconvened Aug 18 at 5:32 p.m. (archived
# 6664fb8d…, pages 10-11). On Aug 18 the council amended its Aug 3 motion "by striking the reference to a moratorium
# not exceeding 120 days ... and substituting a moratorium period of 180 days" (voice vote, 8-0), then adopted "the
# moratorium ordinance establishing a temporary development moratorium applicable to data center facilities with
# electrical power demand exceeding 10 megawatts for a period of 180 days. The motion carried by voice vote. 8-0
# Mayor Pro-Tem Roth was recused." The Greensboro Thread's report (ac94053e…) matches. The regular Aug 18 minutes
# (0759dfed…) record no vote on it.
# The city's news release of Aug 18, 2026, 6:38 PM (archived 5ccd8e17…, saved in a browser Nov 14, 2026) says the
# council "voted 8-0, with one recusal", and that the pause runs "until Sunday, February 14, 2027".
# Two later city releases, saved in a browser Nov 14, 2026, restate it: Aug 31, 2026 (642c75fd…) says the council
# "approved a 180-day moratorium on data centers" covering uses "with an electrical power demand exceeding 10
# megawatts"; Nov 5, 2026 (04e565d7…) says the moratorium period "concludes on February 14 of next year" and that
# the council "prepares for ordinance consideration in February".
# Nov 14, 2026 (#112): the adopted ordinance itself isn't archived yet (the minutes are; the instrument is not).
# Nov 15, 2026: a person searched eSCRIBE for it and found only the 120-day wording, in the Aug 3 minutes already
# archived (5efa77fd…, the motion directing staff to draft the ordinance). No ordinance document, as proposed or as
# adopted at 180 days, was found there.
# The city's Nov 9 release (News/23241) was no longer available when a person tried to save it that night.
# www.greensboro-nc.gov answers HTTP 403 to the archive workflow, so its pages are saved in a browser (--file).
