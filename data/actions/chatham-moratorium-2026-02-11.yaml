# Terms (#115, Nov 17, 2026), from the signed ordinance ("Ordinance of the Chatham County Board of Commissioners
# Instituting a Temporary Moratorium on the Permitting of Data Centers ...", adopted Feb 11, 2026, signed by the Chair
# and attested by the Clerk; archived 692399b5…, saved in a browser from the county's Data Centers page):
# - effective_on and expires_on: Section 1, "commencing on February 11th, 2026, and expiring no later than February
#   11th, 2027" (Section 5: "effective upon adoption").
# - early_termination: Section 1, as written.
# - scope: Section 2(2), as written. Section 1 adds that it "specifically includes all land uses that involve
#   cryptocurrency mining in the unincorporated areas of Chatham County".
# - No ordinance number, threshold or exemptions are stated, so they are left out.
# - status: in_effect. The ordinance runs to Feb 11, 2027, and the county's release (Feb 12, 2026; archived 7ed54d37…,
#   saved in a browser) says it "takes effect immediately and will remain in place until February 11, 2027, or until
#   new zoning regulations are adopted". If the board adopts the data center text amendments heard Oct 29, 2026
#   (Legistar 26-0655/26-0656), the moratorium ends early: record that and set status to expired, sourced to the
#   adoption. The court order in the developer's challenge is the jurisdiction's note (data/jurisdictions/chatham.yaml).
