# Signed minutes of the Board of Commissioners regular session of Monday, Sept 14, 2026 (archived 887b582e…, saved in a
# browser; Vance's robots.txt disallows all robots): after a public hearing "to receive public comments and consider
# the adoption of a 60-day moratorium ordinance on the acceptance, processing, and approval of development
# applications for data centers submitted after the adoption of the moratorium within Vance County", a motion "to
# approve the 60-day moratorium ordinance" passed "5 – 2", two members voting no. The Henderson Daily Dispatch
# (archived 57d7657c…) reports the same meeting.
# Terms (#115, Nov 17, 2026): scope as the minutes word the ordinance. The minutes give the attorney's account of
# what the ordinance would not stop and "the recommendation" that it last "for the sooner of 60 days or upon the
# adoption of a text zoning amendment", but not the adopted text, so early_termination and exemptions are left out,
# as are the dates (don't count 60 days). Archive the ordinance itself if the county posts it.
# The Nov 13 extension (vance-moratorium-2026-11-13) rests on news reports only, so this record doesn't yet say it was
# superseded: once the Nov 13 minutes are archived, add status: superseded and successor_id:
# vance-moratorium-2026-11-13 here, sourced to those minutes.
