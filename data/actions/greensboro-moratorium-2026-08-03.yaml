# Minutes of the Aug 3, 2026 City Council meeting (archived 5efa77fd…, item G, pages 35-36). The council voted 9-0, by
# roll call, to reconsider the July 21 vote, and Councilmember Thurm moved to amend the original motion: staff to
# "initiate the proceedings under N.C.G.S. 160D-107 for a temporary development moratorium applicable to a data
# center facility with an electrical power demand exceeding 10 megawatts", with a hearing on "a moratorium ordinance
# not to exceed 120 days". The minutes record no vote on the amended motion, so votes is left out (the 9-0 is the
# reconsideration). That it passed is in the Aug 17-18 special-meeting minutes (6664fb8d…), which amend "the
# Council's prior motion of August 3, 2026" to 180 days.
