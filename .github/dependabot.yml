# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem to keep PR volume low;
# majors arrive one per PR. Dependabot commits are exempt from the DCO check (tools/dco_check.py).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    # The site, and the pinned deploy tooling publish.yml installs (wrangler).
    directories: [/site, /tools/deploy]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # Workflows, plus each local composite action (they pin actions by SHA too).
    directories: [/, /.github/actions/fetch-cli]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
