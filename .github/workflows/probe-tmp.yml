# TEMPORARY: checks whether Legistar's API still lists Guilford meetings 1629/1631 (structural fields only, no titles).
name: probe-tmp
on:
  push:
    branches: [probe/legistar-1629]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python3 {0}
        run: |
          import json, time, urllib.parse, urllib.request, urllib.error
          UA = "dc-ledger-probe/0.1 (+https://ncdcledger.org/about/)"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, None
              finally:
                  time.sleep(0.5)
          f = urllib.parse.quote("EventDate ge datetime'2026-10-01' and EventDate lt datetime'2026-12-01'")
          status, events = get(f"https://webapi.legistar.com/v1/guilford/events?$filter={f}")
          lines = []
          print = lambda *a: lines.append(" ".join(str(x) for x in a))
          print("events", status, len(events or []))
          for e in events or []:
              print(e["EventId"], repr(e["EventBodyName"]), e["EventDate"][:10], e["EventTime"], e["EventAgendaStatusName"],
                    "agenda" if e["EventAgendaFile"] else "no-agenda", "modified", e["EventLastModifiedUtc"])
          for eid in (1598, 1629, 1599, 1631):
              status, body = get(f"https://webapi.legistar.com/v1/guilford/events/{eid}")
              print("event", eid, status, (body or {}).get("EventLastModifiedUtc"))
          import builtins
          builtins.print("::notice title=probe::" + "%0A".join(lines))
