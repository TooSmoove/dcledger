# Build, test and audit on every pull request and every push to main (docs/SPEC.md §E, Gate 0B §6).
# Required status check for the main ruleset: "CI passed".
# On main it also signs the dcl linux-x64 package that scheduled workflows run (ADR-0007).
name: ci

on:
  pull_request:
  push:
    branches: [main, ci/tmp-12] # THROWAWAY: ci/tmp-12 only
  # Weekly, so a fresh signed CLI exists when nothing is pushed (artifacts expire after 90 days), and so new
  # advisories surface. Also dispatchable to rebuild main's CLI on demand.
  schedule:
    - cron: "43 7 * * 1" # Mondays 07:43 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASTRO_TELEMETRY_DISABLED: "1"
  # Exact SDK: 10.0.403 was listed but not downloadable on Oct 25, 2026 (docs/spikes).
  DOTNET_SDK: 10.0.402

defaults:
  run:
    shell: bash

jobs:
  dotnet:
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        # Vulnerability advisories are checked in the audit job, so a new advisory never breaks builds.
        run: dotnet restore DcLedger.slnx --locked-mode -p:NuGetAudit=false 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format DcLedger.slnx --verify-no-changes --no-restore 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Build (warnings as errors)
        run: dotnet build DcLedger.slnx --no-restore -c Release 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Test
        run: dotnet test --solution DcLedger.slnx --no-build -c Release 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Annotate failure
        if: failure()
        run: bash tools/ci_annotate.sh "dotnet on ${{ matrix.os }}" "$RUNNER_TEMP/ci.log"

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run format:check 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run fixture 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run check 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm test 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Annotate failure
        if: failure()
        working-directory: .
        run: bash tools/ci_annotate.sh "site" "$RUNNER_TEMP/ci.log"

  tools:
    name: tools (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Annotate failure
        if: failure()
        run: bash tools/ci_annotate.sh "tools" "$RUNNER_TEMP/ci.log"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - name: NuGet vulnerabilities (direct and transitive)
        # NuGetAudit warnings (NU1901-NU1904) become errors through TreatWarningsAsErrors.
        run: |
          dotnet restore DcLedger.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
            2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: npm vulnerabilities (non-dev)
        working-directory: site
        run: npm audit --omit=dev --audit-level=low 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Licenses
        run: |
          python3 tools/license_check.py --policy tools/license-policy.json --repo . \
            --nuget-packages "${NUGET_PACKAGES:-$HOME/.nuget/packages}" --npm-lock site/package-lock.json
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
      - name: Annotate failure
        if: failure()
        run: bash tools/ci_annotate.sh "audit" "$RUNNER_TEMP/ci.log"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every commit is signed off
        run: python3 tools/dco_check.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  ledger:
    name: ledger data (dcl validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Record files on the base branch (published IDs are permanent)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          : > "$RUNNER_TEMP/previous-files.txt"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git ls-tree -r --name-only "$BASE" -- data/ | sed 's#^data/##' > "$RUNNER_TEMP/previous-files.txt"
          fi
          wc -l < "$RUNNER_TEMP/previous-files.txt"
      - run: dotnet restore src/DcLedger.Cli --locked-mode -p:NuGetAudit=false
      - name: Validate
        run: |
          dotnet run --project src/DcLedger.Cli -c Release --no-restore -- \
            validate --data data --previous-files "$RUNNER_TEMP/previous-files.txt" --format github

  package:
    name: package (dcl linux-x64)
    # Built and smoke-tested on every event so a pull request can't break it unnoticed; uploaded except on pull
    # requests. Self-contained, so scheduled jobs need no SDK; not single-file (native libraries stay plain files)
    # and not trimmed (YamlDotNet and AWSSDK use reflection). See ADR-0007.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      file-name: ${{ steps.pack.outputs.file-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/DcLedger.Cli -c Release -p:DclPublishRid=linux-x64 -p:RestoreLockedMode=true \
            -p:NuGetAudit=false -o "$RUNNER_TEMP/dcl" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Smoke test (the version names this commit; Eastern-time validation runs)
        env:
          CLI: ${{ runner.temp }}/dcl/dcl
        run: |
          version="$("$CLI" --version)"
          echo "dcl --version: $version"
          if [[ "$version" != *"+$GITHUB_SHA" ]]; then
            echo "::error title=package::dcl --version printed '$version', which doesn't name commit $GITHUB_SHA"
            exit 1
          fi
          "$CLI" validate --data tests/fixtures/ledger/valid 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Pack (deterministic tarball; keeps the executable bit)
        id: pack
        run: |
          python3 -I tools/cli_artifact.py pack --source "$RUNNER_TEMP/dcl" --out-dir "$RUNNER_TEMP/package" \
            --head-sha "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --epoch "$(git log -1 --format=%ct)"
      - name: Upload (unzipped)
        id: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pack.outputs.path }}
          # The artifact is named after the file. Never combine with overwrite (actions/upload-artifact#769).
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: The uploaded digest is the tarball's
        if: github.event_name != 'pull_request'
        env:
          UPLOADED: ${{ steps.upload.outputs.artifact-digest }}
          PACKED: ${{ steps.pack.outputs.sha256 }}
        run: |
          echo "uploaded ${UPLOADED}, packed sha256:${PACKED}"
          [ "${UPLOADED#sha256:}" = "$PACKED" ] || { echo "::error title=package::digest mismatch"; exit 1; }
      - name: Annotate failure
        if: failure()
        run: bash tools/ci_annotate.sh "package" "$RUNNER_TEMP/ci.log"

  ci-passed:
    name: CI passed
    if: always()
    needs: [dotnet, site, tools, audit, dco, ledger, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded (dco is skipped on pushes)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

  attest:
    name: attest (dcl linux-x64)
    # Signs main's package once every required job passed. The status check is explicit on purpose: dco is
    # skipped on pushes, and a skipped job upstream skips any job without one. That is why the old package job
    # never ran on main (#12).
    if: >-
      !cancelled() && needs.ci-passed.result == 'success' && needs.package.outputs.artifact-id != '' &&
      github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/tmp-12')
    needs: [ci-passed, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate; public repository, so recorded in the public Rekor log
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/attest
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/${{ needs.package.outputs.file-name }}
