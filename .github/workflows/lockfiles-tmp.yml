# TEMPORARY (issue #17): regenerates packages.lock.json files on SDK 10.0.402 and pushes them to
# ci/lockfiles-17 for review. Removed before the PR is opened.
name: lockfiles-tmp

on:
  push:
    branches: [feat/17-legistar-adapter]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore DcLedger.slnx --force-evaluate -p:NuGetAudit=false
      - name: Push lock files to ci/lockfiles-17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/lockfiles-17
          git add -f -- '*packages.lock.json'
          git commit -m "Regenerated packages.lock.json files (temporary, #17)" || echo "no lock changes"
          git push -f origin ci/lockfiles-17
