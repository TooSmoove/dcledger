# Week-1 spikes (see docs/SPEC.md §I). Throwaway: remove with spikes/ once results are recorded.
# Each job writes Markdown to $REPORT; the `report` job posts all of it to one "Spike results" issue.
name: spikes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["spikes/**", ".github/workflows/spikes.yml"]

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  sources:
    name: S1/S9/S13 sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT: ${{ github.workspace }}/out/report/1-sources.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p "$(dirname "$REPORT")"
      - name: Probe Legistar and eSCRIBE (S1, S9)
        run: bash spikes/tools/probe_sources.sh out/probe
      - name: Agenda lead time, last 6 months (S13)
        run: |
          UA="dc-ledger-spike/0.1 (+https://github.com/TooSmoove/dcledger)"
          from=$(date -u -d '-183 days' +%Y-%m-%d); to=$(date -u +%Y-%m-%d)
          files=()
          for slug in guilford winston-salem; do
            if [ "$(cat out/probe/api_${slug}_events.status)" != "200" ]; then echo "- $slug: API not open, S13 skipped" >> "$REPORT"; continue; fi
            url="https://webapi.legistar.com/v1/${slug}/events?\$filter=EventDate+ge+datetime%27${from}%27+and+EventDate+lt+datetime%27${to}%27"
            curl -sS -A "$UA" --max-time 60 -o "out/probe/events_6mo_${slug}.json" "$url" && files+=("out/probe/events_6mo_${slug}.json")
            sleep 2
          done
          if [ ${#files[@]} -gt 0 ]; then
            { echo; echo "## S13 agenda lead time (hours, agenda published -> meeting start)"; python3 -I spikes/tools/lead_time.py "${files[@]}"; } >> "$REPORT"
          fi
      - name: Publish report
        if: always()
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-sources
          path: out/report
          retention-days: 14

  basemap:
    name: S4 basemap extract size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT: ${{ github.workspace }}/out/report/2-basemap.md
    steps:
      - run: mkdir -p "$(dirname "$REPORT")"
      - name: List go-pmtiles release assets and fetch the Linux CLI
        run: |
          gh release view --repo protomaps/go-pmtiles --json tagName,assets -q '"release " + .tagName, (.assets[].name)' | tee assets.txt
          { echo "## S4 go-pmtiles release assets"; echo '```'; cat assets.txt; echo '```'; } >> "$REPORT"
          gh release download --repo protomaps/go-pmtiles --pattern '*Linux_x86_64*' --output pmtiles.tgz
          mkdir -p pm && tar -xzf pmtiles.tgz -C pm
          bin=$(find pm -type f -name pmtiles | head -1) && chmod +x "$bin" && cp "$bin" ./pmtiles
          ./pmtiles version || true
      - name: Dry-run NC extract at z14 and z15
        run: |
          build=""
          for i in $(seq 1 10); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then build="https://build.protomaps.com/$d.pmtiles"; break; fi
          done
          echo "## S4 NC extract dry run ($build)" >> "$REPORT"
          for z in 14 15; do
            { echo "### maxzoom $z"; echo '```'; ./pmtiles extract "$build" nc-z$z.pmtiles --bbox=-84.33,33.84,-75.46,36.59 --maxzoom=$z --dry-run 2>&1 | tail -15; echo '```'; } >> "$REPORT"
          done
      - name: Publish report
        if: always()
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-basemap
          path: out/report
          retention-days: 14

  dotnet:
    name: S6/S7/S10 .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: spikes/dotnet
    env:
      SPIKE_OUT: ${{ github.workspace }}/out/dotnet
      REPORT: ${{ github.workspace }}/out/report/3-dotnet-${{ matrix.os }}.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: mkdir -p "$SPIKE_OUT" "$(dirname "$REPORT")" && dotnet --version | tee "$SPIKE_OUT/sdk.txt"
      - id: s6
        name: S6 iCal + pinned VTIMEZONE
        continue-on-error: true
        run: dotnet run --project Spikes.ICal -c Release 2>&1 | tee "$SPIKE_OUT/s6.log"
      - id: s7
        name: S7 DuckDB natives + offline Parquet
        continue-on-error: true
        run: dotnet run --project Spikes.DuckDb -c Release 2>&1 | tee "$SPIKE_OUT/s7.log"
      - id: s10run
        name: S10 test stack via dotnet run
        continue-on-error: true
        run: dotnet run --project Spikes.TestStack -c Release 2>&1 | tee "$SPIKE_OUT/s10run.log"
      - id: s10test
        name: S10 test stack via dotnet test (MTP mode from global.json)
        continue-on-error: true
        run: dotnet test --project Spikes.TestStack -c Release 2>&1 | tee "$SPIKE_OUT/s10test.log"
      - name: S10 transitive license report
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          dotnet restore Spikes.R2
          echo "## S10 license report" >> "$REPORT"
          for p in Spikes.ICal Spikes.DuckDb Spikes.TestStack Spikes.R2; do
            dotnet list "$p" package --include-transitive --format json > "$SPIKE_OUT/$p.packages.json"
            { echo "### $p"; python3 -I ../tools/license_report.py "$SPIKE_OUT/$p.packages.json" "$HOME/.nuget/packages"; } >> "$REPORT"
          done
      - name: Outcomes
        if: always()
        run: |
          excerpt() { # step-id outcome
            [ "$2" = "success" ] && return 0
            [ -f "$SPIKE_OUT/$1.log" ] || return 0
            echo; echo "<details><summary>$1 log excerpt</summary>"; echo; echo '```'
            grep -E 'error|Error|FAIL|Failed|failed|Exception|Should|Assert|warn' "$SPIKE_OUT/$1.log" | grep -v '^\s*$' | head -40
            echo '--- tail ---'; tail -25 "$SPIKE_OUT/$1.log"
            echo '```'; echo "</details>"
          }
          {
            echo "## .NET spike outcomes (${{ runner.os }}, SDK $(cat "$SPIKE_OUT/sdk.txt"))"
            echo "| spike | outcome |"; echo "|---|---|"
            echo "| S6 iCal/VTIMEZONE | ${{ steps.s6.outcome }} |"
            echo "| S7 DuckDB | ${{ steps.s7.outcome }} |"
            echo "| S10 dotnet run | ${{ steps.s10run.outcome }} |"
            echo "| S10 dotnet test (MTP) | ${{ steps.s10test.outcome }} |"
            echo; cat "$SPIKE_OUT"/findings-*.md 2>/dev/null || echo "(no findings written)"
            excerpt s6 "${{ steps.s6.outcome }}"
            excerpt s7 "${{ steps.s7.outcome }}"
            excerpt s10run "${{ steps.s10run.outcome }}"
            excerpt s10test "${{ steps.s10test.outcome }}"
          } >> "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-dotnet-${{ matrix.os }}
          path: out/report
          retention-days: 14

  r2:
    name: S2/S3 R2 round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment secrets are only released to jobs that name the environment (and only on main).
    environment: r2-docs
    defaults:
      run:
        shell: bash
        working-directory: spikes/dotnet
    env:
      SPIKE_OUT: ${{ github.workspace }}/out/r2
      REPORT: ${{ github.workspace }}/out/report/4-r2.md
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
      R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
      R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      BASEMAP_URL: ${{ vars.BASEMAP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - id: r2
        name: R2 round trip (skips without secrets)
        continue-on-error: true
        run: mkdir -p "$SPIKE_OUT" "$(dirname "$REPORT")" && dotnet run --project Spikes.R2 -c Release 2>&1 | tee "$SPIKE_OUT/r2.log"
      - name: Basemap range + CORS check (skips without BASEMAP_URL)
        if: env.BASEMAP_URL != ''
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -D headers.txt -H 'Origin: https://example.org' -H 'Range: bytes=0-16383' "$BASEMAP_URL"
          { echo "## S3 basemap range/CORS"; echo '```'; cat headers.txt; echo '```'; } >> "$REPORT"
          grep -qE '^HTTP/[0-9.]+ 206' headers.txt && grep -qi '^access-control-allow-origin:' headers.txt
      - name: Publish report
        if: always()
        run: |
          {
            echo "## S2/S3 R2 (outcome: ${{ steps.r2.outcome }})"
            if [ -z "$R2_PRIVATE_ACCESS_KEY_ID" ]; then echo "Skipped: r2-docs environment secrets not configured yet."; fi
            cat "$SPIKE_OUT"/findings-*.md 2>/dev/null || true
            if [ "${{ steps.r2.outcome }}" != "success" ] && [ -f "$SPIKE_OUT/r2.log" ]; then echo '```'; tail -30 "$SPIKE_OUT/r2.log"; echo '```'; fi
          } >> "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-r2
          path: out/report
          retention-days: 14

  report:
    name: Post results to issue
    needs: [sources, basemap, dotnet, r2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Create or update the "Spike results" issue
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          { echo "Run: $run_url (commit ${GITHUB_SHA:0:7})"; echo; for f in $(ls reports/*.md | sort); do cat "$f"; echo; done; } > body.raw.md
          # Fetched content is untrusted: neutralize @-mentions and cap the size.
          python3 -I -c "import sys; t=open('body.raw.md',encoding='utf-8',errors='replace').read().replace('@','@​'); open('body.md','w',encoding='utf-8').write(t[:60000])"
          gh label create spike-results --color BFD4F2 --description "Week-1 spike output" 2>/dev/null || true
          num=$(gh issue list --label spike-results --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --title "Week-1 spike results" --label spike-results --body-file body.md
          else
            gh issue comment "$num" --body-file body.md
          fi
