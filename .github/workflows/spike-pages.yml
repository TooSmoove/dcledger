# Spike S16 (#11): does a wrangler direct upload apply _headers (X-Robots-Tag: noindex) on the dcledger Pages project,
# and does the Pages: Edit-only token in the cloudflare-pages environment suffice? Creates the dcledger project first
# if it doesn't exist (moved here from #10). Exit criterion: the production alias serves X-Robots-Tag: noindex from
# _headers after a deploy with that token.
# Throwaway: dispatch only, from main (the environment is restricted to main). Delete it, with spikes/pages/, once
# docs/spikes/2026-10-29-pages-headers.md records the result.
name: spike-pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spike-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

env:
  PROJECT: dcledger
  WRANGLER_VERSION: 4.155.0 # exact; npm "latest" on Oct 29, 2026
  WRANGLER_SEND_METRICS: "false" # no telemetry (SPEC §E)

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-pages
    permissions:
      contents: read
    env:
      MARKER: s16-${{ github.run_id }}-${{ github.run_attempt }}
      # Same Cloudflare account as R2 unless a CLOUDFLARE_ACCOUNT_ID variable says otherwise. Not a secret (ADR-0003).
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            spikes/pages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install wrangler (no secrets in this step)
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
          echo "WRANGLER=$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/report"
          echo "REPORT=$RUNNER_TEMP/report/s16.md" >> "$GITHUB_ENV"

      - name: Check the environment is configured
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN in environment cloudflare-pages")
          [ -n "$ACCOUNT_ID" ] || missing+=("variable R2_ACCOUNT_ID (or CLOUDFLARE_ACCOUNT_ID)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error title=spike S16::missing %s\n' "${missing[@]}"
            exit 1
          fi

      # Wrangler's output in the token steps is printed through redact.sh: an error can name the account, and a
      # Cloudflare account's default name contains the owner's email. Actions logs are public.
      - name: "Token scope: list projects without an account ID (wrangler must look the account up)"
        id: lookup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          "$WRANGLER" pages project list --json > "$RUNNER_TEMP/lookup.out" 2> "$RUNNER_TEMP/lookup.err"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            outcome="succeeded"
          elif grep -q '10000' "$RUNNER_TEMP/lookup.err" "$RUNNER_TEMP/lookup.out"; then
            outcome="failed: authentication error 10000 (the token can't list memberships)"
          elif grep -qi 'more than one account' "$RUNNER_TEMP/lookup.err" "$RUNNER_TEMP/lookup.out"; then
            outcome="failed: the token sees more than one account"
          else
            outcome="failed with exit code $code (see the step log)"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Without an account ID: $outcome"
          bash spikes/pages/redact.sh < "$RUNNER_TEMP/lookup.err"

      - name: Find or create the Pages project (account ID set)
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: |
          list_project() {
            "$WRANGLER" pages project list --json 2> "$RUNNER_TEMP/list.err" \
              | jq -c --arg name "$PROJECT" '[.[] | select(."Project Name" == $name)] | first // empty'
          }
          if ! found="$(list_project)"; then
            bash spikes/pages/redact.sh < "$RUNNER_TEMP/list.err"
            echo "::error title=spike S16::listing Pages projects failed with the scoped token"
            exit 1
          fi
          created=false
          if [ -z "$found" ]; then
            if ! "$WRANGLER" pages project create "$PROJECT" --production-branch main > "$RUNNER_TEMP/create.out" 2>&1; then
              bash spikes/pages/redact.sh < "$RUNNER_TEMP/create.out"
              echo "::error title=spike S16::creating the $PROJECT Pages project failed with the scoped token"
              exit 1
            fi
            bash spikes/pages/redact.sh < "$RUNNER_TEMP/create.out"
            created=true
            found="$(list_project)"
          fi
          # The pages.dev subdomain is global: if dcledger.pages.dev was taken, Cloudflare picks another.
          host="$(jq -r '."Project Domains" | split(", ") | map(select(endswith(".pages.dev"))) | first // empty' <<< "$found")"
          if [ -z "$host" ]; then
            echo "::error title=spike S16::the $PROJECT project lists no pages.dev domain"
            exit 1
          fi
          git_provider="$(jq -r '."Git Provider"' <<< "$found")"
          echo "Project $PROJECT: created by this run=$created, production host=$host, Git provider=$git_provider"
          {
            echo "created=$created"
            echo "host=$host"
            echo "git-provider=$git_provider"
          } >> "$GITHUB_OUTPUT"

      - name: Build the hello-world site
        run: bash spikes/pages/make-site.sh "$RUNNER_TEMP/site" "$MARKER"

      - name: Deploy by direct upload (account ID set)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set +e
          "$WRANGLER" pages deploy "$RUNNER_TEMP/site" --project-name "$PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "Spike S16 (#11), run $GITHUB_RUN_ID" --commit-dirty=true \
            > "$RUNNER_TEMP/deploy.out" 2>&1
          code=$?
          set -e
          bash spikes/pages/redact.sh < "$RUNNER_TEMP/deploy.out"
          if [ "$code" -ne 0 ]; then
            echo "::error title=spike S16::wrangler pages deploy failed with exit code $code"
            exit 1
          fi
          detail="$(jq -c 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)"
          url="$(jq -r '.url // empty' <<< "$detail")"
          if [ -z "$url" ]; then
            echo "::error title=spike S16::wrangler reported no deployment URL"
            exit 1
          fi
          {
            echo "url=$url"
            echo "environment=$(jq -r '.environment // "unknown"' <<< "$detail")"
            echo "alias=$(jq -r '.alias // ""' <<< "$detail")"
          } >> "$GITHUB_OUTPUT"

      - name: Probe the production alias
        id: production
        continue-on-error: true
        env:
          HOST: ${{ steps.project.outputs.host }}
        run: bash spikes/pages/probe.sh "https://$HOST" "$MARKER" "Production alias"

      - name: Probe the unique deployment URL
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash spikes/pages/probe.sh "$URL" "$MARKER" "Deployment URL"

      - name: Verdict
        id: verdict
        if: always()
        env:
          PROJECT_STEP: ${{ steps.project.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          PRODUCTION: ${{ steps.production.outcome }}
          LOOKUP: ${{ steps.lookup.outputs.outcome }}
          CREATED: ${{ steps.project.outputs.created }}
          HOST: ${{ steps.project.outputs.host }}
          GIT_PROVIDER: ${{ steps.project.outputs.git-provider }}
          ENVIRONMENT: ${{ steps.deploy.outputs.environment }}
        run: |
          passed=false
          if [ "$DEPLOY" = success ] && [ "$PRODUCTION" = success ]; then passed=true; fi
          touch "$REPORT"
          {
            echo "### Spike S16 (#11): run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA:0:7}"
            echo
            echo "**Exit criterion met: $passed** (deploy with the scoped token: ${DEPLOY:-skipped}; production alias serves noindex from \`_headers\`: ${PRODUCTION:-skipped})"
            echo
            echo "- wrangler $WRANGLER_VERSION, marker \`$MARKER\`"
            echo "- Without an account ID: ${LOOKUP:-not run}"
            echo "- Find or create the project with the account ID set: ${PROJECT_STEP:-skipped}"
            echo "- Project \`$PROJECT\`: created by this run: ${CREATED:-unknown}; production host: \`${HOST:-unknown}\`; Git provider: ${GIT_PROVIDER:-unknown}"
            echo "- Deployment environment reported by wrangler: ${ENVIRONMENT:-unknown}"
            cat "$REPORT"
          } > "$REPORT.full"
          mv "$REPORT.full" "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-s16-report
          path: ${{ runner.temp }}/report
          retention-days: 14

      - name: Fail unless the exit criterion is met
        if: steps.verdict.outputs.passed != 'true'
        run: exit 1

  report:
    name: Post the result to #11
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spike-s16-report
          path: report
      - name: Comment on issue #11
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          { cat report/s16.md; echo; echo "Run: $run_url"; } > body.raw.md
          # Response headers come from outside: neutralize @-mentions and cap the size.
          python3 -I -c "import sys; t=open('body.raw.md',encoding='utf-8',errors='replace').read().replace('@','@​'); open('body.md','w',encoding='utf-8').write(t[:60000])"
          gh issue comment 11 --body-file body.md
