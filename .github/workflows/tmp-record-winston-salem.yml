# THROWAWAY (issue #26): records scrubbed Winston-Salem Legistar fixtures on a runner, where Legistar is reachable.
# Lives only on branch tmp/26-record-ws and is deleted with it. Never merged.
name: tmp-record-winston-salem

on:
  push:
    branches: [tmp/26-record-ws]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record scrubbed fixtures
        run: |
          python3 tools/record_legistar_fixtures.py --client winston-salem --from 2026-04-27 --to 2027-01-01 \
            --body "City Council" --body "Special Meeting of the City Council" \
            --out out/winston-salem
      - name: Probe body spellings, robots.txt and meeting-page agenda links (names and counts only)
        env:
          UA: "dc-ledger-fixtures/0.1 (+https://ncdcledger.org/about/)"
        run: |
          python3 - <<'PY' > out/probe.txt
          import json, re, time, urllib.request, urllib.error
          UA = {"User-Agent": "dc-ledger-fixtures/0.1 (+https://ncdcledger.org/about/)", "Accept": "*/*"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read(); status = r.status; ctype = r.headers.get("Content-Type")
              except urllib.error.HTTPError as e:
                  body, status, ctype = b"", e.code, None
              time.sleep(0.5)
              return status, ctype, body
          _, _, b = get("https://webapi.legistar.com/v1/winston-salem/bodies")
          print("bodies (repr):")
          for body in json.loads(b):
              print("  ", repr(body.get("BodyName")), "active" if body.get("BodyActiveFlag") else "inactive")
          for host in ("winston-salem.legistar.com", "winston-salem.legistar1.com"):
              s, _, b = get(f"https://{host}/robots.txt")
              print(f"robots.txt {host}: HTTP {s}", b[:200].decode("utf-8", "replace").replace("\n", " | ") if s == 200 else "")
          events = json.load(open("out/winston-salem/events.json"))
          wanted = {"City Council", "Special Meeting of the City Council"}
          link = re.compile(r'href="View\.ashx\?M=A&amp;ID=[0-9]{1,10}&amp;GUID=[0-9A-Fa-f-]{36}(?:&amp;G=[0-9A-Fa-f-]{36})?"')
          checked = 0
          for e in events:
              if (e.get("EventBodyName") or "").strip() not in wanted or not e.get("EventAgendaFile") or checked >= 3:
                  continue
              page = e.get("EventInSiteURL") or ""
              s, ctype, b = get(page) if page.startswith("https://winston-salem.legistar.com/") else (None, None, b"")
              n = len(set(link.findall(b.decode("utf-8", "replace"))))
              print(f"event {e['EventId']}: page host ok={page.startswith('https://winston-salem.legistar.com/')} HTTP {s} {ctype} agenda links={n}")
              if n == 1:
                  href = link.search(b.decode("utf-8", "replace")).group(0)[6:-1].replace("&amp;", "&")
                  s2, ctype2, b2 = get("https://winston-salem.legistar.com/" + href)
                  print(f"  agenda: HTTP {s2} {ctype2} pdf={b2.startswith(b'%PDF-')} bytes={len(b2)}")
              checked += 1
          PY
          cat out/probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winston-salem-fixtures
          path: out/
          retention-days: 1
