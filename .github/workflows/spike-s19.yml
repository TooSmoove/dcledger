# Spike S19 (ADR-0008): Legistar outcome and minutes fields. Throwaway: runs only on the spike branch; delete with it.
name: spike-s19

on:
  push:
    branches: [spike/s19-outcomes]

permissions:
  contents: read

jobs:
  outcomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Query outcomes (names and titles are never printed)
        run: python3 -I spikes/outcomes/spike.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guilford public pages (S19b; only non-personal cells are printed)
        run: python3 -I spikes/outcomes/pages.py | tee -a "$GITHUB_STEP_SUMMARY"
