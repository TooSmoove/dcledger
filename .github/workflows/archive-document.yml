# Archive one document by hand (issue #25): retrieve a public https page or file that ingest doesn't read, such as a
# decision's action-detail page or a news story, keep its bytes in the private bucket under their SHA-256, and print
# the data/documents/ record to paste into a pull request (SPEC AC2, ADR-0003). Runs the dcl that ci built and signed
# on main (ADR-0007). Only people who can run workflows can start it, and r2-docs only releases secrets on main.
name: archive-document
run-name: archive-document (${{ inputs.source-type }})

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public https URL of the document"
        required: true
      source-type:
        description: "Who published it"
        type: choice
        options:
          - official
          - news
        default: official
      dry-run:
        description: "Retrieve and hash only; store nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: archive-document # one at a time: the bucket never rewrites an object, but keep the log readable
  cancel-in-progress: false

jobs:
  archive:
    name: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: r2-docs
    permissions:
      actions: read # find and download the CLI ci built (ADR-0007)
      attestations: read # verify it
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            tools
      - name: Get the CLI from the newest green ci on main
        id: cli
        uses: ./.github/actions/fetch-cli

      - name: Archive
        env:
          CLI: ${{ steps.cli.outputs.cli-path }}
          # Inputs reach the shell only as environment variables, never interpolated into the script.
          URL: ${{ inputs.url }}
          SOURCE_TYPE: ${{ inputs.source-type }}
          DRY_RUN: ${{ inputs.dry-run == true }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          args=(archive-document --url "$URL" --source-type "$SOURCE_TYPE" --format github)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          set +e
          "$CLI" "${args[@]}" > "$RUNNER_TEMP/archive.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/archive.txt"
          {
            echo "### archive-document (exit code $code)"
            echo '```yaml'
            grep -v '^::' "$RUNNER_TEMP/archive.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
