# Linked from /methodology/#corrections (issue #117). We act on every report within 48 hours.
name: Report a correction
description: Something on ncdcledger.org is wrong or out of date.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the ledger accurate. We act on every report within 48 hours: we correct the record,
        or we reply here with what we found. Fixed mistakes are listed in the
        [corrections log](https://ncdcledger.org/methodology/#log).

        **This issue is public.** Please don't include anyone's name unless they're a public official acting in that role.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page with the mistake.
      placeholder: https://ncdcledger.org/items/...
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: What the page says, and what it should say.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What shows it
      description: A link to the record that shows the right information. The government's own page is best.
    validations:
      required: false
